<h2>Orders</h2>
<a href="{% url 'adminpanel:print_labels' %}"
   target="_blank"
   style="padding:8px 15px;background:#000;color:#fff;text-decoration:none;">
🖨 Print Address Labels
</a>

<br><br>

<table border="1" width="100%" cellpadding="6">
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Phone</th>
    <th>Total</th>
    <th>Status</th>
    <th>Date</th>
    <th>Action</th>
</tr>

{% for order in orders %}
<tr>
    <td>{{ order.id }}</td>
    <td>{{ order.full_name }}</td>
    <td>{{ order.phone }}</td>
    <td>₹{{ order.total_amount }}</td>
    <td>{{ order.payment_status }}</td>
    <td>{{ order.created_at|date:"d M Y H:i" }}</td>
    <td>
        <a href="{% url 'adminpanel:order_detail' order.id %}">View / Print</a>
    </td>
</tr>
{% endfor %}
</table>
