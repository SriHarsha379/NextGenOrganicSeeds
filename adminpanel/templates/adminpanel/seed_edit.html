<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Seed - HasaFarm Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- Navbar -->
    <nav class="bg-green-600 text-white p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold">HasaFarm Admin - Edit Seed</h1>
        <a href="{% url 'adminpanel:logout' %}" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded">Logout</a>
    </nav>

    <main class="p-6 max-w-3xl mx-auto">
        <div class="bg-white p-6 rounded shadow">
            <h2 class="text-xl font-semibold mb-4">Edit Seed</h2>

            <form method="POST" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-gray-700">Name</label>
                    <input type="text" name="name" value="{{ seed.name }}" class="w-full border rounded px-3 py-2" required>
                </div>

                <div>
                    <label class="block text-gray-700">Description</label>
                    <textarea name="description" class="w-full border rounded px-3 py-2" rows="4" required>{{ seed.description }}</textarea>
                </div>

                <div>
                    <label class="block text-gray-700">Price</label>
                    <input type="number" step="0.01" name="price" value="{{ seed.price }}" class="w-full border rounded px-3 py-2" required>
                </div>

                <div>
                    <label class="block text-gray-700">Stock</label>
                    <input type="number" name="stock" value="{{ seed.stock }}" class="w-full border rounded px-3 py-2" required>
                </div>

                <div>
                    <label class="block text-gray-700">Category</label>
                    <select name="category" class="w-full border rounded px-3 py-2">
                        <option value="">Select Category</option>
                        {% for category in categories %}
                        <option value="{{ category.id }}" {% if seed.category and seed.category.id == category.id %}selected{% endif %}>
                            {{ category.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-gray-700">Current Image</label>
                    {% if seed.image %}
                        <img src="{{ seed.image.url }}" class="w-24 h-24 object-cover rounded mb-2" alt="{{ seed.name }}">
                    {% else %}
                        N/A
                    {% endif %}
                    <input type="file" name="image" class="w-full border rounded px-3 py-2">
                </div>

                <div class="flex space-x-4 mt-4">
                    <button type="submit" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded shadow">
                        Save Changes
                    </button>
                    <a href="{% url 'adminpanel:seed_list' %}" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded shadow">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
