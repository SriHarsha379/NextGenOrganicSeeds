<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - HASA FARM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7fc;
            color: #333;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #28a745;
            color: white;
            padding: 20px 30px;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-align: center;
        }

        .cart-items {
            list-style-type: none;
            padding: 0;
            margin-bottom: 40px;
        }

        .cart-item {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item h2 {
            font-size: 20px;
            color: #333;
            margin: 0;
        }

        .cart-item p {
            font-size: 16px;
            color: #666;
            margin: 5px 0;
        }

        .total-section {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
        }

        .total-section h3 {
            font-size: 24px;
            color: #333;
        }

        .total-section span {
            font-size: 24px;
            font-weight: bold;
            color: #28a745;
        }

        .checkout-btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            font-size: 18px;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background-color 0.3s ease;
            text-decoration: none;
        }

        .checkout-btn:hover {
            background-color: #218838;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 10px;
            }

            h1 {
                font-size: 28px;
            }

            .cart-item h2 {
                font-size: 18px;
            }

            .total-section h3 {
                font-size: 20px;
            }

            .total-section span {
                font-size: 22px;
            }

            .checkout-btn {
                font-size: 20px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Checkout - Next Gen Organic Seeds</h1>
    </header>

    <div class="container">

        <!-- Cart Items -->
        <ul class="cart-items">
            {% for item in cart_items %}
                <li class="cart-item">
                    <div>
                        <h2>{{ item.seed.name }}</h2>
                        <p>Quantity: {{ item.quantity }}</p>
                        <p>Total: ₹{{ item.total_price }}</p>
                    </div>
                </li>
            {% endfor %}
        </ul>

        <!-- Total Section -->
        <div class="total-section">
            <h3>Grand Total:</h3>
            <span>₹{{ total_amount }}</span>
        </div>

        <!-- Proceed to Payment -->
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="checkout-btn">Proceed to Payment</button>
        </form>

    </div>

</body>
</html>
