{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #42a5f5, #478ed1);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container */
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        /* Login Box */
        .auth-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 90vw; /* Improves mobile responsiveness */
        }

        /* Heading */
        h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        /* Input Fields */
        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            height: 45px; /* Slightly taller */
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        input:focus {
            border-color: #42a5f5;
            outline: none;
            box-shadow: 0 0 5px rgba(66, 165, 245, 0.5);
        }

        /* Button */
        .btn {
            width: 100%;
            background: #42a5f5;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease-in-out, transform 0.2s ease-in-out;
        }

        .btn:hover {
            background: #1e88e5;
            transform: scale(1.05);
        }

        /* Messages */
        .messages {
            background: #ffeb3b;
            color: #333;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        /* Register Text */
        .register-text {
            margin-top: 15px;
            font-size: 14px;
        }

        .register-text a {
            color: #1e88e5;
            text-decoration: none;
            font-weight: 600; /* Increased readability */
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-box {
                padding: 20px;
            }

            h2 {
                font-size: 20px;
            }
        }

        /* Align the Remember Me and Forgot Password in a single row */
        .remember-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        /* Align the Remember Me checkbox */
        .remember-me-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Adjust the checkbox size */
        .remember-me-container input[type="checkbox"] {
            width: 16px;
            height: 16px;
            vertical-align: middle; /* Better alignment */
        }

        /* Style the Forgot Password link */
        .forgot-password {
            font-size: 14px;
        }

        .forgot-password a {
            color: #1e88e5;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Login</h2>
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <p class="message">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <input type="text" name="username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>

                <div class="remember-container">
                    <div class="remember-me-container">
                        <input type="checkbox" id="rememberMe" name="remember_me">
                        <label for="rememberMe">Remember Me</label>
                    </div>
                    <p class="forgot-password"><a href="{% url 'password_reset' %}">Forgot Password?</a></p>
                </div>

                <button type="submit" class="btn">Login</button>
            </form>

            <p class="register-text">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
        </div>
    </div>
</body>
</html>
