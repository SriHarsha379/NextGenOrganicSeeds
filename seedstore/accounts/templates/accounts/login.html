{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - HASA Organic Seeds</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #42a5f5, #478ed1);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container */
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        /* Login Box */
        .auth-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 90vw;
        }

        /* Logo */
        .logo {
            margin-bottom: 10px;
        }
        .logo img {
            height: 70px;
        }

        /* Branding */
        .brand-name {
            font-size: 22px;
            font-weight: 700;
            color: #1e88e5;
            margin-bottom: 15px;
        }

        /* Heading */
        h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        /* Input Fields */
        .input-group {
            width: 100%;
            position: relative;
        }

        input {
            width: 100%;
            height: 45px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        input:focus {
            border-color: #42a5f5;
            outline: none;
            box-shadow: 0 0 5px rgba(66, 165, 245, 0.5);
        }

        /* Show Password Button */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            flex-grow: 1;
            padding-right: 40px; /* Ensure space for the button */
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            font-size: 14px;
            color: #42a5f5;
            cursor: pointer;
            outline: none;
        }

        /* Button */
        .btn {
            width: 100%;
            background: #42a5f5;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease-in-out, transform 0.2s ease-in-out;
        }

        .btn:hover {
            background: #1e88e5;
            transform: scale(1.05);
        }

        /* Messages */
        .messages {
            background: #ffeb3b;
            color: #333;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        /* Remember Me & Forgot Password */
        .remember-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .remember-me-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .remember-me-container input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        .forgot-password {
            font-size: 14px;
        }

        .forgot-password a {
            color: #1e88e5;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        /* Register Text */
        .register-text {
            margin-top: 15px;
            font-size: 14px;
        }

        .register-text a {
            color: #1e88e5;
            text-decoration: none;
            font-weight: 600;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-box {
                padding: 20px;
            }
            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo">
                <img src="{% static 'images/next_gen_organic_seeds_logo.png' %}" alt="Next Gen Organic Seeds Logo">
            </div>
            <div class="brand-name">HASA Organic Seeds</div>
            <h2>Login</h2>

            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <p class="message">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <input type="text" name="username" placeholder="Username" required>
                </div>

                <!-- Password Input with Show/Hide Button -->
                <div class="input-group">
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">Show</button>
                    </div>
                </div>

                <div class="remember-container">
                    <div class="remember-me-container">
                        <input type="checkbox" id="rememberMe" name="remember_me">
                        <label for="rememberMe">Remember Me</label>
                    </div>
                    <p class="forgot-password"><a href="{% url 'password_reset' %}">Forgot Password?</a></p>
                </div>

                <button type="submit" class="btn">Login</button>
            </form>

            <p class="register-text">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
        </div>
    </div>

    <script>
        function togglePassword() {
            let passwordField = document.getElementById("password");
            let toggleButton = document.querySelector(".toggle-password");

            if (passwordField.type === "password") {
                passwordField.type = "text";
                toggleButton.textContent = "Hide";
            } else {
                passwordField.type = "password";
                toggleButton.textContent = "Show";
            }
        }
    </script>
</body>
</html>
