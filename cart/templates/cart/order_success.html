<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Order Status</title>
    <style>
        .container {
            max-width: 600px;
            margin: 3rem auto;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 10px 25px;
            margin-top: 20px;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover {
            background-color: #218838;
        }
        .redirect-msg {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }
    </style>

    {% if not error %}
    <script>
        // Redirect after 7 seconds
        setTimeout(function() {
            window.location.href = "{{ btn_link }}";
        }, 7000); // 7000ms = 7 seconds
    </script>
    {% endif %}
</head>
<body>
    <div class="container">
        {% if error %}
            <h1>Error</h1>
            <p>{{ error }}</p>
            <a href="/" class="btn">Go Home</a>
        {% else %}
            <h1>{{ message_title }}</h1>
            <p>{{ message_body }}</p>
            <a href="{{ btn_link }}" class="btn">{{ btn_text }}</a>
            <p class="redirect-msg">You will be redirected in a few seconds...</p>
        {% endif %}
    </div>
</body>
</html>
