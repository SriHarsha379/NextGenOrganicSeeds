<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Order Status</title>
    <style>
        .container {
            max-width: 600px;
            margin: 3rem auto;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 10px 25px;
            margin-top: 20px;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        {% if error %}
            <h1>Error</h1>
            <p>{{ error }}</p>
            <a href="/" class="btn">Go Home</a>
        {% else %}
            <h1>{{ message_title }}</h1>
            <p>{{ message_body }}</p>
            <a href="{{ btn_link }}" class="btn">{{ btn_text }}</a>
        {% endif %}
    </div>
</body>
</html>
